services:
  - type: web
    name: trymesa
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: OTP_MODE
        value: mock
      - key: CLIENT_ORIGIN
        value: https://trymesa.onrender.com
      - key: PUBLIC_APP_URL
        value: https://trymesa.onrender.com
      - key: UPLOAD_DIR
        value: /opt/render/project/src/server/uploads
