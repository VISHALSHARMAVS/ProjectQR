<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="Mesa — The Table Operating System. Table side QR ordering, 4 digit PIN table protection, 2 second UPI soundbox auto settlement, KDS kitchen display, and live dining room floor management." />
    <meta property="og:title" content="Mesa — The Table Operating System" />
    <meta property="og:description" content="Turn every dining table into an instant checkout. Direct UPI settlement with 0% platform fee, zero app downloads for diners, and real time kitchen display orchestration." />
    <meta property="og:type" content="website" />
    <script>
      (function() {
        try {
          var key = 'projectqr-theme';
          var saved = localStorage.getItem(key);
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'dark' || saved === 'light' ? saved : (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-theme-preference', saved || 'system');
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#07150e' : '#f8fafc');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
